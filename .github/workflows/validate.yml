name: Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Codebase & Build
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      JWT_SECRET: "ci_jwt_secret_key_at_least_43_characters_long_for_testing_purposes"
      VITE_API_URL: https://api.leurettech.com
      EXPO_PUBLIC_API_URL: https://api.leurettech.com
      VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      VITE_TURNSTILE_CHALLENGE_URL: /turnstile.html
      EXPO_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      EXPO_PUBLIC_TURNSTILE_CHALLENGE_URL: https://app.leurettech.com/turnstile

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v7

      - name: 2. Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 3. Install dependencies
        run: |
          npm ci || npm install
          npm install @rollup/rollup-linux-x64-gnu -w apps/admin-web --no-save

      - name: 4. Typecheck all workspaces
        run: npm run typecheck

      - name: 5. Smoke test API Worker runtime
        run: npm run test:worker-runtime -w apps/api

      - name: 6. Run non-destructive API tests
        env:
          DATABASE_MODE: hyperdrive
        run: |
          npm --workspace apps/api run test -- \
            src/auth/__tests__/registration-schema.test.ts \
            src/auth/__tests__/turnstile-validation.test.ts \
            src/auth/__tests__/captcha-bypass.test.ts \
            src/auth/__tests__/password-reset-contract.test.ts \
            src/services/__tests__/email-delivery.test.ts \
            src/security/__tests__/redaction.test.ts

      - name: 7. Test mobile app
        run: npm run test -w apps/mobile

      - name: 8. Build API backend
        run: npm run build:api

      - name: 9. Build admin web application
        run: npm run build:admin

      - name: 10. Build mobile web application
        run: npm run build:mobile

      - name: 11. Verify production client configuration
        run: |
          test -n "$VITE_API_URL"
          test -n "$EXPO_PUBLIC_API_URL"
          test -n "$VITE_TURNSTILE_SITE_KEY"
          test -n "$EXPO_PUBLIC_TURNSTILE_SITE_KEY"

          grep -R -F "$VITE_API_URL" apps/admin-web/dist > /dev/null
          grep -R -F "$EXPO_PUBLIC_API_URL" apps/mobile/dist > /dev/null
          grep -R -F "$VITE_TURNSTILE_SITE_KEY" apps/admin-web/dist > /dev/null
          grep -R -F "$EXPO_PUBLIC_TURNSTILE_SITE_KEY" apps/mobile/dist > /dev/null

          if grep -R -F "https://api.contractor.com.pa" apps/admin-web/dist apps/mobile/dist; then
            echo "Legacy production API fallback found in client bundles."
            exit 1
          fi