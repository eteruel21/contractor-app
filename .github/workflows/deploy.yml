name: Deploy to Cloudflare

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Cloudflare
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://api.leurettech.com
      EXPO_PUBLIC_API_URL: https://api.leurettech.com
      VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      VITE_TURNSTILE_CHALLENGE_URL: /turnstile
      EXPO_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      EXPO_PUBLIC_TURNSTILE_CHALLENGE_URL: https://app.leurettech.com/turnstile

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v7

      - name: 2. Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 3. Install dependencies
        run: |
          npm ci
          npm install @rollup/rollup-linux-x64-gnu -w apps/admin-web --no-save

      - name: 4. Configure production database certificate
        env:
          DATABASE_SSL_CA_PEM: ${{ secrets.PRODUCTION_DATABASE_SSL_CA }}
        run: |
          test -n "$DATABASE_SSL_CA_PEM"
          install -d -m 700 "$RUNNER_TEMP/leuret-database"
          printf '%s\n' "$DATABASE_SSL_CA_PEM" > "$RUNNER_TEMP/leuret-database/supabase-ca.crt"
          chmod 600 "$RUNNER_TEMP/leuret-database/supabase-ca.crt"
          echo "DATABASE_SSL_CA_FILE=$RUNNER_TEMP/leuret-database/supabase-ca.crt" >> "$GITHUB_ENV"

      - name: 5. Block deployment when database migrations drift
        env:
          MIGRATOR_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATOR_DATABASE_URL }}
        run: |
          test -n "$MIGRATOR_DATABASE_URL"
          npm run db:check:supabase

      - name: 6. Typecheck all workspaces
        run: npm run typecheck

      - name: 7. Smoke test API Worker runtime
        run: npm run test:worker-runtime -w apps/api

      - name: 8. Build API Backend Worker
        run: npm run build:api

      - name: 9. Build Admin Web Application
        run: npm run build:admin

      - name: 10. Build Mobile User Web Application
        run: npm run build:mobile

      - name: 11. Verify Client API Configuration
        run: |
          test -n "$VITE_API_URL"
          test -n "$EXPO_PUBLIC_API_URL"
          test -n "$VITE_TURNSTILE_SITE_KEY"
          test -n "$EXPO_PUBLIC_TURNSTILE_SITE_KEY"
          test -n "$EXPO_PUBLIC_TURNSTILE_CHALLENGE_URL"
          grep -R -F "$VITE_API_URL" apps/admin-web/dist > /dev/null
          grep -R -F "$EXPO_PUBLIC_API_URL" apps/mobile/dist > /dev/null
          grep -R -F "$VITE_TURNSTILE_SITE_KEY" apps/admin-web/dist > /dev/null
          grep -R -F "$EXPO_PUBLIC_TURNSTILE_SITE_KEY" apps/mobile/dist > /dev/null
          if [ "$VITE_TURNSTILE_SITE_KEY" = "1x00000000000000000000AA" ]; then
            echo "Production Turnstile sitekey must not be a test key."
            exit 1
          fi
          if grep -R -F "https://api.contractor.com.pa" apps/admin-web/dist apps/mobile/dist; then
            echo "Legacy production API fallback found in client bundles."
            exit 1
          fi

      - name: 12. Deploy API Worker to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./node_modules/.bin/wrangler deploy --config apps/api/wrangler.worker.jsonc

      - name: 13. Deploy Admin Web to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./node_modules/.bin/wrangler pages deploy apps/admin-web/dist --project-name contractor-admin-web --branch main

      - name: 14. Deploy Mobile User Web to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./node_modules/.bin/wrangler pages deploy apps/mobile/dist --project-name contractor-pro-web --branch main
