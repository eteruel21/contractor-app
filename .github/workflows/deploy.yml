name: Deploy to Cloudflare

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Cloudflare
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://api.tctservices-pty.com
      EXPO_PUBLIC_API_URL: https://api.tctservices-pty.com
      VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      VITE_TURNSTILE_CHALLENGE_URL: /turnstile.html
      EXPO_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      EXPO_PUBLIC_TURNSTILE_CHALLENGE_URL: https://contractor-pro-web.pages.dev/turnstile.html

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v7

      - name: 2. Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 3. Install dependencies
        run: |
          npm ci || npm install
          npm install @rollup/rollup-linux-x64-gnu -w apps/admin-web --no-save

      - name: 4. Typecheck all workspaces
        run: npm run typecheck

      - name: 5. Smoke test API Worker runtime
        run: npm run test:worker-runtime -w apps/api

      - name: 6. Build API Backend Worker
        run: npm run build:api

      - name: 7. Build Admin Web Application
        run: npm run build:admin

      - name: 8. Build Mobile User Web Application
        run: npm run build:mobile

      - name: 9. Verify Client API Configuration
        run: |
          test -n "$VITE_API_URL"
          test -n "$EXPO_PUBLIC_API_URL"
          test -n "$VITE_TURNSTILE_SITE_KEY"
          test -n "$EXPO_PUBLIC_TURNSTILE_SITE_KEY"
          test -n "$EXPO_PUBLIC_TURNSTILE_CHALLENGE_URL"
          grep -R -F "$VITE_API_URL" apps/admin-web/dist > /dev/null
          grep -R -F "$EXPO_PUBLIC_API_URL" apps/mobile/dist > /dev/null
          grep -R -F "$VITE_TURNSTILE_SITE_KEY" apps/admin-web/dist > /dev/null
          grep -R -F "$EXPO_PUBLIC_TURNSTILE_SITE_KEY" apps/mobile/dist > /dev/null
          if [ "$VITE_TURNSTILE_SITE_KEY" = "1x00000000000000000000AA" ]; then
            echo "Production Turnstile sitekey must not be a test key."
            exit 1
          fi
          if grep -R -F "https://api.contractor.com.pa" apps/admin-web/dist apps/mobile/dist; then
            echo "Legacy production API fallback found in client bundles."
            exit 1
          fi

      - name: 10. Deploy API Worker to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config apps/api/wrangler.worker.jsonc

      - name: 11. Deploy Admin Web to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy apps/admin-web/dist --project-name contractor-admin-web --branch main

      - name: 12. Deploy Mobile User Web to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy apps/mobile/dist --project-name contractor-pro-web --branch main
